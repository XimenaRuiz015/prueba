services:
  - type: web
    name: asistente-equigrup
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.2:latest
      # Configura GROQ_API_KEY o GEMINI_API_KEY en el panel de Render para activar la IA gratis en la nube
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

